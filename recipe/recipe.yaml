schema_version: 1

context:
  name: free-proxy
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/free_proxy-${{ version }}.tar.gz
  sha256: 2a812c05b17b92ca93c50988cc40f5eda35d01e38d1b8612912a3859cc406227

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lxml >=5.0,<7
    - python >=${{ python_min }}
    - requests >=2.31,<3

tests:
  - python:
      imports:
        - fp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Proxy scraper for further use
  homepage: https://github.com/jundymek/free-proxy
  repository: https://github.com/jundymek/free-proxy
  documentation: https://github.com/jundymek/free-proxy

extra:
  recipe-maintainers:
    - jan-janssen
    - arunkannawadi
    - jundymek
